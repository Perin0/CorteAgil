<form #produtoForm="ngForm" (ngSubmit)="cadastrar(produtoForm)">
    <div>
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="novoProduto.nome" required>
    </div>

    <div>
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" [(ngModel)]="novoProduto.quantidade" required>
    </div>

    <button type="submit" [disabled]="!produtoForm.valid">Cadastrar</button>
</form>

<hr>
<h3>Produtos Cadastrados:</h3>
<ul>
    @for (p of produtos; track p; let i = $index){
        <li>{{ p.nome }} - Quantidade: {{ p.quantidade }}</li>
        <button (click)="remover(i)">Remover Produto</button>
    }

</ul>
